<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1440" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1b30"/>
      <stop offset="55%" stop-color="#13253f"/>
      <stop offset="100%" stop-color="#0a1626"/>
    </linearGradient>
    <radialGradient id="orb-blue" cx="30%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#2b456b" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#1f3a63" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1f3a63" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb-emerald" cx="82%" cy="88%" r="52%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#0f5132" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0f5132" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb-light" cx="72%" cy="12%" r="48%">
      <stop offset="0%" stop-color="#476d9d" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#476d9d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9db5d4" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#9db5d4" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="1440" fill="url(#base)"/>
  <rect width="1440" height="1440" fill="url(#orb-blue)"/>
  <rect width="1440" height="1440" fill="url(#orb-emerald)"/>
  <rect width="1440" height="1440" fill="url(#orb-light)"/>

  <!-- arco monumental sutil -->
  <path d="M 400 1440 L 400 780 C 400 470, 610 280, 720 280 C 830 280, 1040 470, 1040 780 L 1040 1440 Z" fill="#223c60" opacity="0.16"/>
  <path d="M 460 1440 L 460 800 C 460 520, 640 350, 720 350 C 800 350, 980 520, 980 800 L 980 1440 Z" fill="#2b456b" opacity="0.12"/>

  <!-- drapejados fluidos -->
  <path d="M -100 380 C 280 250, 560 470, 880 350 S 1380 300, 1540 430 L 1540 1540 L -100 1540 Z" fill="#172e4e" opacity="0.35"/>
  <path d="M -100 700 C 300 560, 600 860, 900 720 S 1400 620, 1540 770 L 1540 1540 L -100 1540 Z" fill="#1f3a63" opacity="0.3"/>
  <path d="M -100 1050 C 250 900, 520 1200, 820 1080 S 1350 980, 1540 1130 L 1540 1540 L -100 1540 Z" fill="url(#silk)"/>
</svg>
